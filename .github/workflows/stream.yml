name: Diwali Live Stream

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: diwali-live-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install a real Chrome binary
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Install xvfb and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg python3

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Serve the scene locally
        run: |
          cd "$GITHUB_WORKSPACE"
          nohup python3 -m http.server 8080 > server.log 2>&1 &
          sleep 2

      - name: Launch Chrome fullscreen with the animation
        run: |
          rm -rf /tmp/chrome-profile
          mkdir -p /tmp/chrome-profile

          nohup "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --kiosk \
            --window-size=1920,1080 \
            --window-position=0,0 \
            --no-first-run \
            --no-default-browser-check \
            --no-sandbox \
            --disable-infobars \
            --disable-dev-shm-usage \
            --disable-popup-blocking \
            --disable-notifications \
            --autoplay-policy=no-user-gesture-required \
            --disable-gpu \
            --user-data-dir=/tmp/chrome-profile \
            "http://localhost:8080/index.html" \
            > chromium.log 2>&1 &

          sleep 8

      - name: Stream to YouTube via ffmpeg
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is not set. See README.md." >&2
            exit 1
          fi

          ffmpeg \
            -f x11grab \
            -video_size 1920x1080 \
            -framerate 30 \
            -i :99 \
            -f lavfi \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -b:v 3000k \
            -maxrate 3000k \
            -bufsize 6000k \
            -pix_fmt yuv420p \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
