name: Diwali Live Stream

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: diwali-live-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ============================================
      # INSTALL CHROME
      # ============================================
      - name: Install a real Chrome binary
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      # ============================================
      # INSTALL REQUIRED PACKAGES
      # ============================================
      - name: Install Xvfb, FFmpeg, Python and fonts
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            ffmpeg \
            python3 \
            fonts-noto-core \
            fonts-noto-color-emoji

          fc-cache -f -v

      # ============================================
      # START VIRTUAL DISPLAY
      # ============================================
      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > xvfb.log 2>&1 &

          sleep 3

          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # ============================================
      # SERVE HTML
      # ============================================
      - name: Serve the scene locally
        run: |
          cd "$GITHUB_WORKSPACE"

          nohup python3 -m http.server 8080 \
            > server.log 2>&1 &

          sleep 3

          echo "HTML server started"

          curl -I http://localhost:8080/index.html

      # ============================================
      # LAUNCH CHROME
      # ============================================
      - name: Launch Chrome fullscreen with the animation
        run: |
          rm -rf /tmp/chrome-profile
          mkdir -p /tmp/chrome-profile

          nohup "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --kiosk \
            --window-size=1920,1080 \
            --window-position=0,0 \
            --start-maximized \
            --no-first-run \
            --no-default-browser-check \
            --no-sandbox \
            --disable-infobars \
            --disable-dev-shm-usage \
            --disable-popup-blocking \
            --disable-notifications \
            --autoplay-policy=no-user-gesture-required \
            --use-gl=angle \
            --use-angle=swiftshader \
            --disable-background-timer-throttling \
            --disable-backgrounding-occluded-windows \
            --disable-renderer-backgrounding \
            --disable-features=CalculateNativeWinOcclusion \
            --force-device-scale-factor=1 \
            --user-data-dir=/tmp/chrome-profile \
            "http://localhost:8080/index.html" \
            > chromium.log 2>&1 &

          sleep 8

          echo "Chrome started"

      # ============================================
      # VERIFY CHROME / PAGE
      # ============================================
      - name: Verify browser and display
        run: |
          echo "DISPLAY=$DISPLAY"

          echo "Checking X display..."
          xdpyinfo -display :99 | head -20 || true

          echo "Checking Chrome process..."
          pgrep -af chrome || true

          echo "Checking page..."
          curl -s http://localhost:8080/index.html | head -20 || true

      # ============================================
      # STREAM TO YOUTUBE
      # ============================================
      - name: Stream to YouTube via FFmpeg
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is not set."
            exit 1
          fi

          echo "Starting YouTube stream..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -thread_queue_size 1024 \
            -f x11grab \
            -draw_mouse 0 \
            -video_size 1920x1080 \
            -framerate 30 \
            -i :99 \
            -f lavfi \
            -thread_queue_size 512 \
            -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -profile:v high \
            -level 4.2 \
            -pix_fmt yuv420p \
            -r 30 \
            -b:v 5000k \
            -minrate 5000k \
            -maxrate 5000k \
            -bufsize 10000k \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
