<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diwali Live — India Shines</title>
<style>

<body>
  <canvas id="scene" width="1920" height="1080"></canvas>
  <div class="ribbon"></div>
  <div class="title">Happy Diwali — India Shines ✨</div>
  <div class="subtitle">Wishing You Light Over Darkness &amp; Joy Over Sorrow</div>
  <div class="hindi">शुभ दीपावली</div>
  <div class="countdown" id="countdown">
    <div class="countdown-label">Diwali — Sunday, November 8, 2026</div>
    <div class="countdown-row" id="countdownRow">
      <div class="countdown-unit"><span class="countdown-num" id="cdDays">--</span><span class="countdown-unit-label">Days</span></div>
      <div class="countdown-unit"><span class="countdown-num" id="cdHours">--</span><span class="countdown-unit-label">Hours</span></div>
      <div class="countdown-unit"><span class="countdown-num" id="cdMins">--</span><span class="countdown-unit-label">Minutes</span></div>
      <div class="countdown-unit"><span class="countdown-num" id="cdSecs">--</span><span class="countdown-unit-label">Seconds</span></div>
    </div>
  </div>
  <div class="clockbox" id="clock"></div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ================= Clock (IST) =================
function updateClock(){
  const now = new Date();
  const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset())*60000);
  const h = String(ist.getHours()).padStart(2,'0');
  const m = String(ist.getMinutes()).padStart(2,'0');
  const s = String(ist.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `IST ${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// ================= Countdown to Diwali (Sun, Nov 8 2026, IST midnight) =================
const DIWALI_TARGET = Date.UTC(2026, 10, 7, 18, 30, 0); // Nov 8 2026 00:00 IST = Nov 7 18:30 UTC
function updateCountdown(){
  const now = Date.now();
  const diff = DIWALI_TARGET - now;
  const row = document.getElementById('countdownRow');
  const label = document.querySelector('.countdown-label');
  if (diff <= 0){
    label.textContent = 'Diwali is here!';
    row.innerHTML = '<div class="countdown-done">Happy Diwali! 🪔✨</div>';
    return;
  }
  const secTotal = Math.floor(diff/1000);
  const days = Math.floor(secTotal/86400);
  const hours = Math.floor((secTotal%86400)/3600);
  const mins = Math.floor((secTotal%3600)/60);
  const secs = secTotal%60;
  document.getElementById('cdDays').textContent = String(days);
  document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2,'0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2,'0');
}
setInterval(updateCountdown, 1000);
updateCountdown();

function hexToRgba(hex, a){
  const v = parseInt(hex.slice(1),16);
  const r=(v>>16)&255, g=(v>>8)&255, b=v&255;
  return `rgba(${r},${g},${b},${a})`;
}

// ================= Stars =================
const stars = [];
for (let i=0;i<220;i++){
  stars.push({
    x: Math.random()*W,
    y: Math.random()*H*0.7,
    r: Math.random()*1.6+0.4,
    phase: Math.random()*Math.PI*2,
    speed: 0.5+Math.random()*1.2
  });
}

const MAP_SCALE = 0.52, MAP_OFFX = 560, MAP_OFFY = 290;
function toCanvas(p){ return [p[0]*MAP_SCALE+MAP_OFFX, p[1]*MAP_SCALE+MAP_OFFY]; }
const mainlandPts = INDIA_MAINLAND.map(toCanvas);
const andamanPts = INDIA_ANDAMAN.map(toCanvas);
const sriLankaPts = SRI_LANKA.map(toCanvas);

function polyPath(pts){
  ctx.beginPath();
  pts.forEach(([x,y],i)=> i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
  ctx.closePath();
}

function drawIndia(t){
  const glow = 26 + Math.sin(t/700)*9;

  // --- mainland ---
  ctx.save();
  polyPath(mainlandPts);
  const minY = Math.min(...mainlandPts.map(p=>p[1]));
  const maxY = Math.max(...mainlandPts.map(p=>p[1]));
  const grad = ctx.createLinearGradient(0, minY, 0, maxY);
  grad.addColorStop(0, '#ffe9a0');
  grad.addColorStop(0.4, '#ffb347');
  grad.addColorStop(0.75, '#ff8c1a');
  grad.addColorStop(1, '#e8590c');
  ctx.fillStyle = grad;
  ctx.shadowColor = 'rgba(255,170,60,0.95)';
  ctx.shadowBlur = glow;
  ctx.globalAlpha = 0.96;
  ctx.fill();
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = '#fff4d6';
  ctx.shadowBlur = glow*1.5;
  ctx.stroke();

  ctx.save();
  polyPath(mainlandPts);
  ctx.clip();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(MAP_OFFX+280*MAP_SCALE, MAP_OFFY+240*MAP_SCALE, 90*MAP_SCALE, 240*MAP_SCALE, -0.1, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.restore();

  // --- Andaman & Nicobar chain ---
  ctx.save();
  polyPath(andamanPts);
  ctx.fillStyle = '#ffb347';
  ctx.shadowColor = 'rgba(255,170,60,0.9)';
  ctx.shadowBlur = glow*0.6;
  ctx.globalAlpha = 0.95;
  ctx.fill();
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = '#fff4d6';
  ctx.stroke();
  ctx.restore();

  // --- Sri Lanka ---
  ctx.save();
  polyPath(sriLankaPts);
  ctx.fillStyle = '#ffb347';
  ctx.shadowColor = 'rgba(255,170,60,0.9)';
  ctx.shadowBlur = glow*0.6;
  ctx.globalAlpha = 0.95;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#fff4d6';
  ctx.stroke();
  ctx.restore();
}

function perimeterPoints(pts, count){
  const segs = [];
  let total = 0;
  for (let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[(i+1)%pts.length];
    const d = Math.hypot(b[0]-a[0], b[1]-a[1]);
    segs.push({a,b,d});
    total += d;
  }
  const step = total/count;
  const out = [];
  let segIdx = 0, segPos = 0;
  for (let i=0;i<count;i++){
    while (segPos > segs[segIdx].d){
      segPos -= segs[segIdx].d;
      segIdx = (segIdx+1)%segs.length;
    }
    const seg = segs[segIdx];
    const f = seg.d===0?0:segPos/seg.d;
    out.push([seg.a[0]+(seg.b[0]-seg.a[0])*f, seg.a[1]+(seg.b[1]-seg.a[1])*f]);
    segPos += step;
  }
  return out;
}
const diyaSpots = perimeterPoints(mainlandPts, 110);
const bulbColors = ['#fff3c4','#ffb347','#ff7b1a','#ffd700','#ff5e3a'];

function drawDiya(x,y,t,seed){
  const flick = 0.75 + 0.25*Math.sin(t/90 + seed*10) + 0.08*Math.sin(t/37+seed*4);
  const color = bulbColors[seed % bulbColors.length];
  ctx.save();
  ctx.translate(x,y);
  ctx.beginPath();
  ctx.ellipse(0,6,7,3.2,0,0,Math.PI*2);
  ctx.fillStyle = '#7a3b1e';
  ctx.fill();
  const g = ctx.createRadialGradient(0,-6,0,0,-6,13*flick);
  g.addColorStop(0,'rgba(255,255,240,0.98)');
  g.addColorStop(0.4, hexToRgba(color,0.9));
  g.addColorStop(1, hexToRgba(color,0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0,-6,13*flick,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0,-8,2*flick,5*flick,0,0,Math.PI*2);
  ctx.fillStyle = '#fff8e0';
  ctx.fill();
  ctx.restore();
}

function drawTwinkle(x,y,t,seed){
  const a = 0.5+0.5*Math.sin(t/200+seed*7);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#fff3c4';
  ctx.shadowColor = '#ffd27a';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(x,y,2.2,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
const andamanTwinkles = perimeterPoints(andamanPts, 10);
const sriLankaTwinkles = perimeterPoints(sriLankaPts, 14);

// ================= Moon =================
function drawMoon(t){
  const mx = 190, my = 150, r = 62;
  ctx.save();
  const glow = ctx.createRadialGradient(mx,my,r*0.5,mx,my,r*2.4);
  glow.addColorStop(0,'rgba(255,250,220,0.35)');
  glow.addColorStop(1,'rgba(255,250,220,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(mx,my,r*2.4,0,Math.PI*2); ctx.fill();

  ctx.beginPath();
  ctx.arc(mx,my,r,0,Math.PI*2);
  const body = ctx.createRadialGradient(mx-r*0.3,my-r*0.3,r*0.1,mx,my,r);
  body.addColorStop(0,'#fffef2');
  body.addColorStop(1,'#f2e6b8');
  ctx.fillStyle = body;
  ctx.shadowColor = 'rgba(255,250,220,0.7)';
  ctx.shadowBlur = 24;
  ctx.fill();

  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#c9b98a';
  [[-15,-10,10],[10,15,7],[0,-25,5],[-20,18,6]].forEach(([dx,dy,cr])=>{
    ctx.beginPath(); ctx.arc(mx+dx,my+dy,cr,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

// ================= Top garland / toran =================
const buntingCount = 46;
const buntingColors = ['#FF9933','#ffffff','#138808','#ffd23f'];
function drawGarland(t){
  const y0 = 16, spacing = W/(buntingCount-1);
  ctx.save();
  ctx.beginPath();
  for (let i=0;i<=buntingCount;i++){
    const x = i*spacing;
    const sag = Math.sin((i/buntingCount)*Math.PI)*10;
    const y = y0 + sag*0.4;
    i===0? ctx.moveTo(x,y): ctx.lineTo(x,y);
  }
  ctx.strokeStyle = 'rgba(255,224,150,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  for (let i=0;i<buntingCount;i++){
    const x = i*spacing + spacing/2;
    const sag = Math.sin((i/buntingCount)*Math.PI)*10;
    const yTop = y0 + sag*0.4;
    const col = buntingColors[i%buntingColors.length];
    ctx.beginPath();
    ctx.moveTo(x-9, yTop);
    ctx.lineTo(x+9, yTop);
    ctx.lineTo(x, yTop+26);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.85;
    ctx.fill();
    const tw = 0.5+0.5*Math.sin(t/260 + i*1.3);
    ctx.globalAlpha = tw;
    ctx.beginPath();
    ctx.arc(x, yTop+30, 2.6, 0, Math.PI*2);
    ctx.fillStyle = '#fff3c4';
    ctx.shadowColor = '#ffd27a';
    ctx.shadowBlur = 10;
    ctx.fill();
  }
  ctx.restore();
}

// ================= Falling marigold petals =================
const petals = [];
for (let i=0;i<40;i++){
  petals.push({
    x: Math.random()*W, y: Math.random()*H,
    speed: 0.4+Math.random()*0.9,
    drift: Math.random()*Math.PI*2,
    driftSpeed: 0.2+Math.random()*0.3,
    size: 4+Math.random()*4,
    rot: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()-0.5)*0.03,
    color: Math.random()<0.5 ? '#ff9933' : '#ffd23f'
  });
}
function updateAndDrawPetals(t){
  ctx.save();
  petals.forEach(p=>{
    p.y += p.speed;
    p.x += Math.sin(t/1000*p.driftSpeed + p.drift)*0.6;
    p.rot += p.rotSpeed;
    if (p.y > H+10){ p.y = -10; p.x = Math.random()*W; }
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0,0,p.size,p.size*0.55,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

// ================= Floating sky lanterns =================
const lanterns = [];
for (let i=0;i<9;i++){
  lanterns.push({
    x: 100 + Math.random()*1720,
    y: 1080 + Math.random()*600,
    speed: 0.25+Math.random()*0.35,
    sway: Math.random()*Math.PI*2,
    swaySpeed: 0.3+Math.random()*0.4,
    scale: 0.7+Math.random()*0.7
  });
}
function updateAndDrawLanterns(t){
  lanterns.forEach(l=>{
    l.y -= l.speed;
    if (l.y < -60){ l.y = 1080+Math.random()*200; l.x = 100+Math.random()*1720; }
    const sx = l.x + Math.sin(t/1000*l.swaySpeed + l.sway)*18;
    ctx.save();
    ctx.translate(sx, l.y);
    ctx.scale(l.scale, l.scale);
    const g = ctx.createRadialGradient(0,0,0,0,0,34);
    g.addColorStop(0,'rgba(255,224,150,0.8)');
    g.addColorStop(1,'rgba(255,150,50,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-11,-16); ctx.quadraticCurveTo(-15,10,0,20);
    ctx.quadraticCurveTo(15,10,11,-16);
    ctx.closePath();
    const body = ctx.createLinearGradient(0,-16,0,20);
    body.addColorStop(0,'#ffdf9e');
    body.addColorStop(1,'#ff9a3c');
    ctx.fillStyle = body;
    ctx.globalAlpha = 0.92;
    ctx.fill();
    ctx.restore();
  });
}

// ================= Rangoli =================
function drawRangoli(t){
  const cx = 960, cy = 960;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(1, 0.4);
  ctx.rotate(t/9000);
  const colors = ['#FF9933','#ffffff','#138808','#ffd23f','#e63946'];

  const glow = ctx.createRadialGradient(0,0,20,0,0,150);
  glow.addColorStop(0,'rgba(255,190,90,0.25)');
  glow.addColorStop(1,'rgba(255,190,90,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0,0,150,0,Math.PI*2); ctx.fill();

  for (let ring=0; ring<3; ring++){
    const radius = 128 - ring*38;
    const petalsN = 12 + ring*6;
    const pw = 15 - ring*3, ph = 6.5 - ring;
    for (let i=0;i<petalsN;i++){
      const ang = (Math.PI*2/petalsN)*i;
      const px = Math.cos(ang)*radius;
      const py = Math.sin(ang)*radius;
      ctx.save();
      ctx.translate(px,py);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.ellipse(0,0, pw, ph, 0, 0, Math.PI*2);
      ctx.fillStyle = colors[(ring+i)%colors.length];
      ctx.globalAlpha = 0.8;
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.beginPath();
  ctx.arc(0,0,20,0,Math.PI*2);
  ctx.fillStyle = '#ffd23f';
  ctx.shadowColor = 'rgba(255,210,100,0.9)';
  ctx.shadowBlur = 20;
  ctx.globalAlpha = 0.95;
  ctx.fill();
  ctx.restore();
}

// ================= Fireworks (aerial — several distinct cracker types) =================
let fireworks = [];
let particles = [];
const colorSets = [
  ['#ffd23f','#ff8c42','#ff3c38'],
  ['#8ecae6','#219ebc','#ffffff'],
  ['#ff9933','#ffffff','#138808'],
  ['#f72585','#c77dff','#ffd6ff'],
  ['#ffe066','#ff6b35','#f72585'],
  ['#ffd700','#ffffff','#ffb347']
];
const crackerTypes = ['peony','chrysanthemum','willow','ring','crackle','palm'];

function spawnFirework(){
  const x = 120 + Math.random()*1680;
  const targetY = 130 + Math.random()*270;
  const type = crackerTypes[Math.floor(Math.random()*crackerTypes.length)];
  fireworks.push({
    x, y:1080, vy:-11-Math.random()*3.5, targetY,
    trail: [],
    type,
    colors: colorSets[Math.floor(Math.random()*colorSets.length)]
  });
}
setInterval(spawnFirework, 850);

function explode(x,y,colors,type){
  if (type === 'peony'){
    const count = 90;
    for (let i=0;i<count;i++){
      const ang = (Math.PI*2/count)*i + Math.random()*0.12;
      const speed = 2.5+Math.random()*5.5;
      particles.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        life:1, decay:0.008+Math.random()*0.012, size:1.8+Math.random()*1.8,
        color: colors[Math.floor(Math.random()*colors.length)], type:'dot' });
    }
  } else if (type === 'chrysanthemum'){
    const count = 70;
    for (let i=0;i<count;i++){
      const ang = (Math.PI*2/count)*i;
      const speed = 4+Math.random()*4.5;
      particles.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        life:1, decay:0.006+Math.random()*0.006, size:1.6, trail:[],
        color: colors[Math.floor(Math.random()*colors.length)], type:'streak' });
    }
  } else if (type === 'willow'){
    const count = 60;
    for (let i=0;i<count;i++){
      const ang = (Math.PI*2/count)*i + Math.random()*0.2;
      const speed = 2+Math.random()*3.2;
      particles.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed*0.6-1,
        life:1, decay:0.003+Math.random()*0.003, size:1.6, gravity:0.05, trail:[],
        color:'#ffd27a', type:'streak' });
    }
  } else if (type === 'ring'){
    const count = 60;
    for (let i=0;i<count;i++){
      const ang = (Math.PI*2/count)*i;
      const speed = 4.2+Math.random()*0.4;
      particles.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        life:1, decay:0.009+Math.random()*0.004, size:2,
        color: colors[Math.floor(Math.random()*colors.length)], type:'dot' });
    }
  } else if (type === 'crackle'){
    const count = 100;
    for (let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const speed = 1.5+Math.random()*5.5;
      particles.push({ x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        life:1, decay:0.01+Math.random()*0.02, size:1.4+Math.random()*1.2,
        color: Math.random()<0.5?'#ffffff':colors[0], type:'strobe', seed:Math.random()*10 });
    }
  } else if (type === 'palm'){
    const arms = 8;
    for (let a=0; a<arms; a++){
      const ang = (Math.PI*2/arms)*a + Math.random()*0.1;
      const speed = 6+Math.random()*1.5;
      for (let j=0;j<9;j++){
        particles.push({ x,y, vx:Math.cos(ang)*speed*(0.4+j*0.07), vy:Math.sin(ang)*speed*(0.4+j*0.07),
          life:1, decay:0.006+Math.random()*0.004, size:2.2, gravity:0.03, trail:[],
          color: colors[a%colors.length], type:'streak' });
      }
    }
  }
  particles.push({x,y,vx:0,vy:0,life:1,decay:0.12,size:38,color:'#ffffff',type:'flash'});
}

function updateFireworks(){
  fireworks = fireworks.filter(f=>{
    f.trail.push({x:f.x,y:f.y});
    if (f.trail.length>6) f.trail.shift();
    f.y += f.vy;
    if (f.y <= f.targetY){
      explode(f.x, f.y, f.colors, f.type);
      return false;
    }
    return true;
  });
  particles = particles.filter(p=>{
    if (p.trail){
      p.trail.push({x:p.x,y:p.y});
      if (p.trail.length>5) p.trail.shift();
    }
    p.x += p.vx; p.y += p.vy;
    p.vy += (p.gravity!==undefined ? p.gravity : 0.045);
    p.vx *= 0.99;
    p.life -= p.decay;
    return p.life > 0;
  });
}

function drawFireworks(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  fireworks.forEach(f=>{
    f.trail.forEach((pt,i)=>{
      ctx.globalAlpha = (i/f.trail.length)*0.5;
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,2,0,Math.PI*2);
      ctx.fillStyle = '#ffdd8a';
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(f.x,f.y,3,0,Math.PI*2);
    ctx.fillStyle = '#fff8e0';
    ctx.shadowColor = '#ffdd8a';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  particles.forEach(p=>{
    if (p.type === 'flash'){
      ctx.globalAlpha = Math.max(p.life,0)*0.6;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else if (p.type === 'streak' && p.trail){
      p.trail.forEach((pt,i)=>{
        ctx.globalAlpha = Math.max(p.life,0) * (i/p.trail.length) * 0.8;
        ctx.beginPath();
        ctx.arc(pt.x,pt.y,p.size*0.8,0,Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else if (p.type === 'strobe'){
      const flick = Math.sin(p.life*40 + p.seed) > 0.2 ? 1 : 0;
      ctx.globalAlpha = Math.max(p.life,0) * flick;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else {
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
  });
  ctx.restore();
}

// ================= Ground fountain (anaar) =================
const anaar = { x: 210, y: 1040, sparks: [] };
function updateAndDrawAnaar(t){
  for (let i=0;i<3;i++){
    const ang = -Math.PI/2 + (Math.random()-0.5)*0.9;
    const speed = 4+Math.random()*5;
    anaar.sparks.push({
      x: anaar.x, y: anaar.y,
      vx: Math.cos(ang)*speed*0.5, vy: Math.sin(ang)*speed,
      life:1, decay:0.012+Math.random()*0.01,
      color: Math.random()<0.6 ? '#ffd23f' : '#ff8c1a'
    });
  }
  anaar.sparks = anaar.sparks.filter(s=>{
    s.x += s.vx; s.y += s.vy; s.vy += 0.16; s.vx *= 0.99;
    s.life -= s.decay;
    return s.life>0 && s.y < 1080;
  });
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(anaar.x-14, anaar.y+4);
  ctx.lineTo(anaar.x+14, anaar.y+4);
  ctx.lineTo(anaar.x+9, anaar.y-14);
  ctx.lineTo(anaar.x-9, anaar.y-14);
  ctx.closePath();
  ctx.fillStyle = '#8a4a26';
  ctx.fill();
  ctx.strokeStyle = '#5c2f14';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.globalCompositeOperation = 'lighter';
  anaar.sparks.forEach(s=>{
    ctx.globalAlpha = Math.max(s.life,0);
    ctx.beginPath();
    ctx.arc(s.x,s.y,2,0,Math.PI*2);
    ctx.fillStyle = s.color;
    ctx.fill();
  });
  ctx.restore();
}

// ================= Ground spinner (chakri) =================
const chakri = { x: 1710, y: 1040, angle:0 };
function updateAndDrawChakri(t){
  chakri.angle += 0.28;
  ctx.save();
  ctx.translate(chakri.x, chakri.y);
  ctx.fillStyle = '#5c2f14';
  ctx.fillRect(-3, 0, 6, 30);
  ctx.rotate(chakri.angle);
  ctx.beginPath();
  ctx.arc(0,0,10,0,Math.PI*2);
  ctx.fillStyle = '#3a2a1a';
  ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  const arms = 4;
  for (let a=0;a<arms;a++){
    const ang = (Math.PI*2/arms)*a;
    const ex = Math.cos(ang)*34, ey = Math.sin(ang)*34;
    const grad = ctx.createLinearGradient(0,0,ex,ey);
    grad.addColorStop(0,'rgba(255,210,100,0.9)');
    grad.addColorStop(1,'rgba(255,120,30,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(ex,ey);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex,ey,2.4,0,Math.PI*2);
    ctx.fillStyle = '#fff3c4';
    ctx.fill();
  }
  ctx.restore();
}

// ================= Main loop =================
function frame(t){
  ctx.clearRect(0,0,W,H);

  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050314');
  sky.addColorStop(0.55,'#0d0730');
  sky.addColorStop(1,'#1c0f3a');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  stars.forEach(s=>{
    const a = 0.4 + 0.6*Math.abs(Math.sin(t/1000*s.speed + s.phase));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  drawMoon(t);
  updateAndDrawLanterns(t);
  updateAndDrawPetals(t);

  updateFireworks();
  drawFireworks();

  drawRangoli(t);
  updateAndDrawAnaar(t);
  updateAndDrawChakri(t);

  drawIndia(t);
  diyaSpots.forEach(([x,y],i)=> drawDiya(x,y,t,i));
  andamanTwinkles.forEach(([x,y],i)=> drawTwinkle(x,y,t,i));
  sriLankaTwinkles.forEach(([x,y],i)=> drawTwinkle(x,y,t,i+20));

  drawGarland(t);

  const vg = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
